# Desarrollo (DataPack/Config sin rebuild): ver docker-compose.dev.yml y dev-restart.ps1

services:
    postgres:
        image: postgres:alpine
        container_name: db
        restart: unless-stopped
        volumes:
            - ./create_database.sql:/docker-entrypoint-initdb.d/create_database.sql:ro
#            - ./:/var/lib/postgresql/data
        environment:
            - PGDATA=/var/lib/postgresql/data/.postgresdata
            - POSTGRES_PASSWORD=postgres_password
        # Evita que Auth/Game ejecuten migraciones mientras Postgres sigue en recovery (57P03).
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d l2dev"]
            interval: 2s
            timeout: 5s
            retries: 30
            start_period: 30s

    l2dn-authserver:
        build:
            context: ../
            dockerfile: Docker/Dockerfile.AuthServer
        image: l2dn-authserver
        container_name: l2dn-authserver
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        ports:
            - 2106:2106 # AuthServer port for the client

    l2dn-gameserver:
        build:
            context: ../
            dockerfile: Docker/Dockerfile.GameServer
            args:
                PUBLISH_ADDRESS: ${L2DN_PUBLISH_ADDRESS:-192.168.0.100}
        image: l2dn-gameserver
        container_name: l2dn-gameserver
        depends_on:
            postgres:
                condition: service_healthy
            l2dn-authserver:
                condition: service_started
        restart: unless-stopped
        ports:
            - 7777:7777 # GameServer port for the client
