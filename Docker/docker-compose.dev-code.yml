# Desarrollo con cambios en C#: publica en host y monta los binarios (sin rebuild de imagen).
#   .\dev-publish.ps1
#   docker compose -f docker-compose.yml -f docker-compose.dev-code.yml -f docker-compose.dev.yml up -d l2dn-gameserver
# dev.yml debe ir al final para que DataPack/Config del host tapen los del publish.

services:
  l2dn-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: l2dn-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9464:9464"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
      - ./telemetry:/var/lib/otel

  l2dn-gameserver:
    depends_on:
      l2dn-otel-collector:
        condition: service_started
    environment:
      NPC_REACTIVE_SCHEDULER_MODE: Enabled
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://l2dn-otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: 5000
    volumes:
      - ./publish/gameserver:/App
      - ./config.gameserver.docker.json:/App/config.dev.json:ro
