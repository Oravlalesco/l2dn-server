# Desarrollo con cambios en C#: publica en host y monta los binarios (sin rebuild de imagen).
#   .\dev-publish.ps1
#   docker compose -f docker-compose.yml -f docker-compose.dev-code.yml -f docker-compose.dev.yml up -d l2dn-gameserver
# dev.yml debe ir al final para que DataPack/Config del host tapen los del publish.

services:
  l2dn-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    container_name: l2dn-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9464:9464"
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
      - ./telemetry:/var/lib/otel

  l2dn-gameserver:
    depends_on:
      l2dn-otel-collector:
        condition: service_started
    environment:
      NPC_REACTIVE_SCHEDULER_MODE: Enabled
      NPC_BRAIN_MODE: Intent
      NPC_STRATEGY_MODE: Enabled
      NPC_STRATEGY_TEMPLATE_PROFILES: >-
        20016:balanced,20120:balanced,20121:balanced,
        20432:balanced,20442:balanced,20481:balanced,20544:balanced,
        20093:aggressive_pressure,20096:aggressive_pressure,20098:aggressive_pressure,
        20103:aggressive_pressure,20106:aggressive_pressure,20108:aggressive_pressure,
        20130:aggressive_pressure,20131:aggressive_pressure,20132:aggressive_pressure,
        20326:aggressive_pressure,20342:aggressive_pressure,20343:aggressive_pressure,
        20006:ranged_control,20101:ranged_control,20110:ranged_control,
        20113:ranged_control,20115:ranged_control,
        20292:survival
      NPC_PERCEPTION_MODE: CaptureOnly
      NPC_RETURN_DEFENSE_ENABLED: "true"
      NPC_RETURN_DEFENSE_TIMEOUT_MS: 120000
      NPC_LEASH_GRACE_MS: 20000
      NPC_LEASH_MAX_EXCURSIONS: 3
      NPC_LEASH_HARD_EXTENSION: 500
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://l2dn-otel-collector:4317
      OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: 5000
    volumes:
      - ./publish/gameserver:/App
      - ./config.gameserver.docker.json:/App/config.dev.json:ro
